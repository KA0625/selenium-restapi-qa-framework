name: Run Selenium Tests in Cloud

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Start Selenium Grid (Hub + Chrome Node)
        run: |
          docker pull selenium/hub:4.43.0
          docker pull selenium/node-chrome:4.43.0

          docker network create grid

          docker run -d --network grid --name selenium-hub -p 4444:4444 selenium/hub:4.43.0

          docker run -d --network grid --name chrome \
            -e SE_EVENT_BUS_HOST=selenium-hub \
            -e SE_EVENT_BUS_PUBLISH_PORT=4442 \
            -e SE_EVENT_BUS_SUBSCRIBE_PORT=4443 \
            selenium/node-chrome:4.43.0

          echo "Waiting for Selenium Grid to be ready..."
          sleep 10

      - name: Run Tests on Cloud Selenium Grid
        run: |
          mvn clean test -Dselenium.hub.url=http://localhost:4444/wd/hub

      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: test-output
