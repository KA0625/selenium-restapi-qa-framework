name: Run Selenium Tests in Cloud

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  run-tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: Selenium2025
          MYSQL_DATABASE: naco
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Wait for MySQL to be ready
        run: sleep 15

      - name: Initialize Database (Create USA table)
        run: |
          echo "Creating USA table..."
          mysql -h localhost -u root -pSelenium2025 naco << 'EOF'
            CREATE TABLE IF NOT EXISTS USA (
              StateCode VARCHAR(5) PRIMARY KEY,
              StateName VARCHAR(100)
            );

            INSERT IGNORE INTO USA (StateCode, StateName) VALUES
              ('WI', 'Wisconsin'),
              ('OH', 'Ohio'),
              ('AL', 'Alabama'),
              ('WV', 'West Virginia'),
              ('DE', 'Delaware'),
              ('FL', 'Florida'),
              ('NJ', 'New Jersey'),
              ('VT', 'Vermont'),
              ('MA', 'Massachusetts'),
              ('NH', 'New Hampshire'),
              ('ME', 'Maine'),
              ('NY', 'New York'),
              ('PA', 'Pennsylvania'),
              ('IA', 'Iowa'),
              ('MS', 'Mississippi'),
              ('TN', 'Tennessee'),
              ('AZ', 'Arizona'),
              ('CA', 'California'),
              ('NM', 'New Mexico'),
              ('UT', 'Utah'),
              ('WY', 'Wyoming'),
              ('ID', 'Idaho'),
              ('TX', 'Texas');
          EOF

      - name: Start Selenium Grid (Hub + 6 Chrome Nodes + 5 Firefox Nodes)
        run: |
          docker pull selenium/hub:4.43.0
          docker pull selenium/node-chrome:4.43.0
          docker pull selenium/node-firefox:4.43.0

          docker network create grid || echo "grid network already exists"

          docker run -d --network grid --name selenium-hub -p 4444:444
