name: Run Selenium Tests in Cloud

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  run-tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: Selenium2025
          MYSQL_DATABASE: naco
          MYSQL_DEFAULT_AUTHENTICATION_PLUGIN: mysql_native_password
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install MySQL Client
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-client

      - name: Wait for MySQL to be ready
        run: |
          echo "Waiting for MySQL to be ready..."
          for i in {1..30}; do
            if mysql -h localhost -u root -pSelenium2025 -e "SELECT 1" &> /dev/null; then
              echo "MySQL is ready!"
              exit 0
            fi
            echo "Attempt $i: MySQL not ready yet, waiting..."
            sleep 2
          done
          echo "MySQL failed to start"
          exit 1

      - name: Initialize Database (Create USA table)
        run: |
          echo "Creating USA table..."
          mysql -h localhost -u root -pSelenium2025 naco << 'EOF'
            CREATE TABLE IF NOT EXISTS USA (
              StateCode VARCHAR(5) PRIMARY KEY,
              StateName VARCHAR(100)
            );

            INSERT IGNORE INTO USA (StateCode, StateName) VALUES
              ('WI', 'Wisconsin'),
              ('OH', 'Ohio'),
              ('AL', 'Alabama'),
              ('WV', 'West Virginia'),
              ('DE', 'Delaware'),
              ('FL', 'Florida'),
              ('NJ', 'New Jersey'),
              ('VT', 'Vermont'),
              ('MA', 'Massachusetts'),
              ('NH', 'New Hampshire'),
              ('ME', 'Maine'),
              ('NY', 'New York'),
              ('PA', 'Pennsylvania'),
              ('IA', 'Iowa'),
              ('MS', 'Mississippi'),
              ('TN', 'Tennessee'),
              ('AZ', 'Arizona'),
              ('CA', 'California'),
              ('NM', 'New Mexico'),
              ('UT', 'Utah'),
              ('WY', 'Wyoming'),
              ('ID', 'Idaho'),
              ('TX', 'Texas');
          EOF

      - name: Start Selenium Grid (Hub + 6 Chrome Nodes + 5 Firefox Nodes)
        run: |
          docker pull selenium/hub:4.43.0
          docker pull selenium/node-chrome:4.43.0
          docker pull selenium/node-firefox:4.43.0

          docker network create grid || echo "grid network already exists"

          docker run -d --network grid --name selenium-hub -p 4444:4444 selenium/hub:4.43.0 || echo "hub already running"

          # Chrome nodes (6)
          for i in 1 2 3 4 5 6; do
            docker run -d --network grid --name chrome$i \
              -e SE_EVENT_BUS_HOST=selenium-hub \
              -e SE_EVENT_BUS_PUBLISH_PORT=4442 \
              -e SE_EVENT_BUS_SUBSCRIBE_PORT=4443 \
              selenium/node-chrome:4.43.0 || echo "chrome$i already running"
          done

          # Firefox nodes (5)
          for i in 1 2 3 4 5; do
            docker run -d --network grid --name firefox$i \
              -e SE_EVENT_BUS_HOST=selenium-hub \
              -e SE_EVENT_BUS_PUBLISH_PORT=4442 \
              -e SE_EVENT_BUS_SUBSCRIBE_PORT=4443 \
              selenium/node-firefox:4.43.0 || echo "firefox$i already running"
          done

          echo "Waiting for Selenium Grid to be ready..."
          sleep 25

      - name: Run Chrome Tests (testng.xml)
        run: |
          mvn clean test \
            -Dbrowser=chrome \
            -DsuiteXmlFile=testng.xml \
            -DrunOnGrid=true \
            -Dselenium.hub.url=http://localhost:4444/wd/hub

      - name: Upload Chrome Report
        uses: actions/upload-artifact@v4
        with:
          name: chrome-report
          path: test-output/**

      - name: Run Firefox Tests (testng-firefox.xml)
        run: |
          mvn test \
            -Dbrowser=firefox \
            -DsuiteXmlFile=testng-firefox.xml \
            -DrunOnGrid=true \
            -Dselenium.hub.url=http://localhost:4444/wd/hub

      - name: Upload Firefox Report
        uses: actions/upload-artifact@v4
        with:
          name: firefox-report
          path: test-output/**
