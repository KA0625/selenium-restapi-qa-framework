name: Run Selenium Tests in Cloud

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  run-tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: Selenium2025
          MYSQL_DATABASE: naco
          MYSQL_DEFAULT_AUTHENTICATION_PLUGIN: mysql_native_password
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s
          --health-timeout=10s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install MySQL Client
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-client

      - name: Wait for MySQL to be ready
        run: |
          echo "Waiting for MySQL to be ready..."
          sleep 10
          for i in {1..30}; do
            if mysql -h localhost -u root -pSelenium2025 -e "SELECT 1" &> /dev/null; then
              echo "MySQL is ready!"
              exit 0
            fi
            echo "Attempt $i: MySQL not ready yet, waiting..."
            sleep 2
          done
          echo "MySQL failed to start"
          exit 1

      - name: Initialize Database (Create USA table)
        run: |
          echo "Creating USA table..."
          mysql -h localhost -u root -pSelenium2025 naco << 'EOF'
            CREATE TABLE IF NOT EXISTS USA (
              StateCode VARCHAR(5) PRIMARY KEY,
              StateName VARCHAR(100)
            );

            INSERT IGNORE INTO USA (StateCode, StateName) VALUES
              ('WI', 'Wisconsin'),
              ('OH', 'Ohio'),
              ('AL', 'Alabama'),
              ('WV', 'West Virginia'),
              ('DE', 'Delaware'),
              ('FL', 'Florida'),
              ('NJ', 'New Jersey'),
              ('VT', 'Vermont'),
              ('MA', 'Massachusetts'),
              ('NH', 'New Hampshire'),
              ('ME', 'Maine'),
              ('NY', 'New York'),
              ('PA', 'Pennsylvania'),
              ('IA', 'Iowa'),
              ('MS', 'Mississippi'),
              ('TN', 'Tennessee'),
              ('AZ', 'Arizona'),
              ('CA', 'California'),
              ('NM', 'New Mexico'),
              ('UT', 'Utah'),
              ('WY', 'Wyoming'),
              ('ID', 'Idaho'),
              ('TX', 'Texas');
          EOF

